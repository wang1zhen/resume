name: Build resume

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '**.tex'
      - '**.sty'
      - '1.jpg'
      - '.github/workflows/build-resume.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-resume-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile with XeLaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            main.tex
            main_en.tex
          latexmk_use_xelatex: true
          # resume.sty pins Noto Sans CJK JP via fontspec, which is a system
          # font rather than a TeX Live package. Install it before compiling,
          # covering both the Alpine and Debian flavours of the action image.
          pre_compile: |
            if command -v apk >/dev/null 2>&1; then
              apk add --no-cache font-noto-cjk
            else
              apt-get update && apt-get install -y --no-install-recommends fonts-noto-cjk
            fi
            fc-cache -f

      - name: Rename for download
        run: |
          cp main.pdf    WANG-Yizhen-Resume-JA.pdf
          cp main_en.pdf WANG-Yizhen-Resume-EN.pdf

      - uses: actions/upload-artifact@v4
        with:
          name: resume-pdf
          path: WANG-Yizhen-Resume-*.pdf
          if-no-files-found: error

      # A tag push cuts a permanent, versioned release. Any other build
      # refreshes the rolling `latest` release so the newest PDF always sits
      # at a stable URL.
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: WANG-Yizhen-Resume-*.pdf
          generate_release_notes: true

      - name: Refresh rolling release
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: |
            Built from `${{ github.sha }}` on ${{ github.event.head_commit.timestamp || github.run_started_at }}.
          files: WANG-Yizhen-Resume-*.pdf
          prerelease: true
          make_latest: false
